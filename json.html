<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
	<meta name="referrer" content="no-referrer">
	<title>Simple JSON formatter</title>
	<style>
		body { font-family: sans-serif; margin: 16px; }
		textarea { width: 100%; max-width: 800px; height: 200px; box-sizing: border-box; font-family: monospace; }
		#output { font-family: monospace; white-space: pre; overflow-x: auto; }
		#error { color: #c00; font-family: monospace; white-space: pre-wrap; }
		.key { color: #92278f; }
		.string { color: #3ab54a; }
		.number { color: #25aae2; }
		.boolean { color: #f98280; }
		.null { color: #f1592a; }
		#top { position: fixed; bottom: 10px; right: 10px; }
	</style>
</head>
<body>
	<h3 id="header">Simple JSON formatter</h3>
	<textarea id="input" placeholder="enter json string here" spellcheck="false"></textarea>
	<div>
		<button id="format">format!</button>
		<label>indent <select id="indent"><option>2</option><option selected>4</option><option value="tab">tab</option></select></label>
	</div>
	<div id="error"></div>
	<pre id="output"></pre>
	<a id="top" href="#header">Back to top</a>
	<script>
		const input = document.getElementById('input');
		const indent = document.getElementById('indent');
		const output = document.getElementById('output');
		const error = document.getElementById('error');

		const TOKEN = /"(?:[^"\\]|\\.)*"|[{}\[\],:]|[^\s{}\[\],:"]+/g;
		const NON_PRINTABLE_ASCII = /[^\t\n\r -~]/gu;
		const HIGHLIGHT_LIMIT = 1_000_000;

		// Code points that render as nothing or reorder text (bidi, zero-width, tag characters).
		// Written as numbers on purpose: raw characters here are invisible in editors and broke this regex before.
		const INVISIBLE_RANGES = [
			[0x7f, 0x9f], [0xad, 0xad], [0x34f, 0x34f], [0x61c, 0x61c], [0x115f, 0x1160],
			[0x17b4, 0x17b5], [0x180b, 0x180f], [0x200b, 0x200f], [0x2028, 0x202e], [0x2060, 0x206f],
			[0x2800, 0x2800], [0x3164, 0x3164], [0xfe00, 0xfe0f], [0xfeff, 0xfeff], [0xffa0, 0xffa0],
			[0xfff0, 0xfffb], [0x1d173, 0x1d17a], [0xe0000, 0xe0fff],
		];

		function isInvisible(char) {
			const codePoint = char.codePointAt(0);
			return INVISIBLE_RANGES.some(([low, high]) => codePoint >= low && codePoint <= high);
		}

		function toJsonEscape(char) {
			let escaped = '';
			for (let i = 0; i < char.length; i++) escaped += '\\u' + char.charCodeAt(i).toString(16).padStart(4, '0');
			return escaped;
		}

		function escapeInvisible(text) {
			return text.replace(NON_PRINTABLE_ASCII, (char) => (isInvisible(char) ? toJsonEscape(char) : char));
		}

		function tokenClass(token, next) {
			if (token[0] === '"') return next === ':' ? 'key' : 'string';
			if (token === 'true' || token === 'false') return 'boolean';
			if (token === 'null') return 'null';
			return 'number';
		}

		// Re-indents the original tokens instead of JSON.stringify(JSON.parse(...)) so big integers,
		// key order and duplicate keys are shown exactly as pasted. Assumes the text already passed JSON.parse.
		function reindent(text, unit) {
			const tokens = text.match(TOKEN) ?? [];
			const pieces = [];
			let depth = 0;
			const newline = () => '\n' + unit.repeat(depth);
			tokens.forEach((token, i) => {
				const prev = tokens[i - 1];
				const next = tokens[i + 1];
				if (token === '{' || token === '[') {
					depth++;
					pieces.push([token]);
					if (next !== '}' && next !== ']') pieces.push([newline()]);
				} else if (token === '}' || token === ']') {
					depth--;
					if (prev !== '{' && prev !== '[') pieces.push([newline()]);
					pieces.push([token]);
				} else if (token === ',') {
					pieces.push([',' + newline()]);
				} else if (token === ':') {
					pieces.push([': ']);
				} else {
					pieces.push([escapeInvisible(token), tokenClass(token, next)]);
				}
			});
			return pieces;
		}

		function render(pieces, totalLength) {
			if (totalLength > HIGHLIGHT_LIMIT) {
				output.textContent = pieces.map(([text]) => text).join('');
				return;
			}
			const fragment = document.createDocumentFragment();
			for (const [text, className] of pieces) {
				if (!className) {
					fragment.append(text);
					continue;
				}
				const span = document.createElement('span');
				span.className = className;
				span.textContent = text;
				fragment.append(span);
			}
			output.append(fragment);
		}

		function format() {
			error.textContent = '';
			output.textContent = '';
			if (!input.value.trim()) return;
			try {
				JSON.parse(input.value);
			} catch (e) {
				error.textContent = e.message;
				return;
			}
			const unit = indent.value === 'tab' ? '\t' : ' '.repeat(Number(indent.value));
			render(reindent(input.value, unit), input.value.length);
		}

		document.getElementById('format').addEventListener('click', format);
		indent.addEventListener('change', format);
		input.addEventListener('keydown', (e) => {
			if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) format();
		});
	</script>
</body>
</html>
